[pytest]
testpaths = tests
addopts = -v --tb=short

markers =
    gpu: marks tests that require a CUDA-capable GPU (deselect with '-m "not gpu"')
    slow: marks tests as slow-running (deselect with '-m "not slow"')
    smoke: marks tests that require pretrained model downloads from HuggingFace (deselect with '-m "not smoke"')
    integration: marks tests as integration tests that instantiate real models

filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning

[coverage:run]
source = utils,evaluation,models
omit =
    */tests/*
    */__pycache__/*
    */conftest.py

[coverage:report]
show_missing = true
skip_covered = false
fail_under = 0
